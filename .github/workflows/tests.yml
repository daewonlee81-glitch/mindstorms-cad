# MindStorms CAD 자동 회귀 테스트 — 올릴 때마다(push·PR) 빠른 테스트, Actions 탭에서 손으로 실행하면 전체 테스트까지
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "느린 전체 테스트(시범→학습→주행)까지"
        type: boolean
        default: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 준비
        run: |
          pip install playwright websockets pillow numpy
          python -m playwright install --with-deps chromium
      - name: 테스트
        run: python tests/run.py ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: tests/_out
          if-no-files-found: ignore
